// ---------- pure helpers ----------
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toMonthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthKeyFromDateStr(ds) { return ds.slice(0, 7); }
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return 'RM 0.00';
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtHrs(n) { return (Math.round(n * 100) / 100).toFixed(1); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// Reads the real current date/time in Malaysia (Asia/Kuala_Lumpur), regardless
// of what timezone the viewing phone or browser happens to be set to. Every
// "what day/time is it" question in the app goes through this, so an admin in
// a different timezone can never disagree with the driver's phone about what
// day it is, and check-in/out times are always true Malaysia time.
function nowInKL() {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Kuala_Lumpur',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date()).map(p => [p.type, p.value])
  );
  const hh = parts.hour === '24' ? '00' : parts.hour;
  return { dateStr: `${parts.year}-${parts.month}-${parts.day}`, hh, mm: parts.minute };
}
// A Date object anchored to "today" in Malaysia, safe to use with the local
// getters (getDate/getMonth/getDay/toLocaleDateString) further down.
function todayInKL() {
  return new Date(nowInKL().dateStr + 'T00:00:00');
}

function getDayType(dateStr, settings) {
  if (settings.publicHolidays.some(h => h.date === dateStr)) return 'public_holiday';
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  if (dow === 0 || dow === 6) return 'rest_day';
  return 'workday';
}
function dayTypeLabel(t) {
  return t === 'workday' ? 'Workday' : t === 'rest_day' ? 'Rest day' : 'Public holiday';
}
function statusLabel(s) {
  return s === 'leave' ? 'On leave' : s === 'medical_leave' ? 'Medical leave' : 'Present';
}
function prettyLabel(ds) {
  const d = new Date(ds + 'T00:00:00');
  return d.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric', month: 'short' });
}
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function elapsedHours(inT, outT) {
  let mins = timeToMinutes(outT) - timeToMinutes(inT);
  if (mins < 0) mins += 1440;
  return mins / 60;
}
// Hours worked are counted from whichever is later: the normal start time
// (9:00am) or his actual check-in. Arriving early doesn't add extra hours;
// arriving late (e.g. 9:30am) simply starts the count from 9:30am.
function workedHoursFor(inT, outT, settings) {
  const effectiveIn = timeToMinutes(inT) < timeToMinutes(settings.standardStart) ? settings.standardStart : inT;
  const el = elapsedHours(effectiveIn, outT);
  return el > settings.breakHours ? el - settings.breakHours : el;
}
function paidHoursPerDay(settings) {
  const std = elapsedHours(settings.standardStart, settings.standardEnd);
  const paid = std - settings.breakHours;
  return paid > 0 ? paid : 8;
}
// Hours worked past a clock-time cutoff (e.g. 6:00pm), regardless of how many
// total hours were worked or when check-in happened. Handles an overnight
// shift (check-out time-of-day earlier than check-in) by rolling it to the
// next day before comparing against the cutoff.
function hoursPastCutoff(checkIn, checkOut, cutoff) {
  const inMin = timeToMinutes(checkIn);
  let outMin = timeToMinutes(checkOut);
  if (outMin < inMin) outMin += 1440; // shift crossed midnight
  const cutoffMin = timeToMinutes(cutoff);
  const diff = outMin - cutoffMin;
  return diff > 0 ? diff / 60 : 0;
}
function hourlyRate(settings) {
  if (!settings.monthlySalary) return 0;
  return settings.monthlySalary / 26 / 8;
}
function dayRate(settings) {
  if (!settings.monthlySalary) return 0;
  return settings.monthlySalary / 26;
}

// The driver's first month is pro-rated by calendar days from the start date
// to month end; every month after that pays the full monthly salary.
function proratedBaseSalary(monthDate, settings) {
  if (!settings.monthlySalary) return 0;
  const mk = toMonthKey(monthDate);
  const startMk = settings.startDate ? settings.startDate.slice(0, 7) : null;
  if (!startMk || mk > startMk) return settings.monthlySalary;
  if (mk < startMk) return 0; // month is before the driver even started
  const startDay = parseInt(settings.startDate.slice(8, 10), 10);
  const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
  const daysWorked = Math.max(0, daysInMonth - startDay + 1);
  return settings.monthlySalary * daysWorked / daysInMonth;
}
function isProratedMonth(monthDate, settings) {
  return settings.startDate && toMonthKey(monthDate) === settings.startDate.slice(0, 7);
}

function computeDay(dateStr, entry, settings) {
  if (!entry) return null;
  if (entry.status === 'leave' || entry.status === 'medical_leave') {
    return { dayType: getDayType(dateStr, settings), worked: 0, otHours: 0, otPay: 0, note: statusLabel(entry.status), status: entry.status };
  }
  if (!entry.checkIn || !entry.checkOut) return null;

  // Total hours actually worked, counted from the real check-in time.
  const worked = workedHoursFor(entry.checkIn, entry.checkOut, settings);
  const dayType = getDayType(dateStr, settings);
  const hr = hourlyRate(settings);
  const dr = dayRate(settings);
  // Irham's normal working hours are fixed at standardStart–standardEnd
  // (default 9:00am–6:00pm). For workdays, OT is triggered by staying past
  // standardEnd (his shift always starts around 9am, so this is equivalent
  // to working beyond the normal daily quota). For rest days and public
  // holidays, Section 60(3)/60D of the Employment Act instead bases the
  // premium rate purely on whether TOTAL HOURS WORKED exceed the normal
  // daily quota — regardless of what clock time those hours fall in. A
  // shift entirely outside 9–6 (e.g. an evening-only public holiday call-out)
  // that doesn't exceed the normal daily hours gets no 3x premium at all.
  const normalHours = paidHoursPerDay(settings);
  const beyondH = hoursPastCutoff(entry.checkIn, entry.checkOut, settings.standardEnd);
  const excessH = Math.max(0, worked - normalHours);
  let otPay = 0, otHours = 0, note = '';

  if (dayType === 'workday') {
    otHours = beyondH;
    otPay = otHours * hr * 1.5;
    note = otHours > 0 ? fmtHrs(otHours) + 'h OT @1.5x (after ' + settings.standardEnd + ')' : 'No OT';
  } else if (dayType === 'rest_day') {
    let base = 0;
    if (worked <= 4) { base = 0.5 * dr; }
    else { base = 1 * dr; }
    const excessPay = excessH * hr * 2;
    otHours = worked; // whole day is off-duty, so every hour worked counts as OT hours
    otPay = base + excessPay;
    note = worked <= 4 ? 'Half day rest-day pay' : (excessH > 0 ? 'Full day + ' + fmtHrs(excessH) + 'h @2x (beyond ' + fmtHrs(normalHours) + 'h normal hours)' : 'Full day rest-day pay');
  } else {
    let base = worked > 0 ? 2 * dr : 0;
    const excessPay = excessH * hr * 3;
    otHours = worked; // whole day is off-duty, so every hour worked counts as OT hours
    otPay = base + excessPay;
    note = worked > 0 ? (excessH > 0 ? '2 days + ' + fmtHrs(excessH) + 'h @3x (beyond ' + fmtHrs(normalHours) + 'h normal hours)' : "2 days' holiday pay") : '';
  }
  return { dayType, worked, otHours, otPay, note, status: 'present' };
}

// Records needing an admin's attention: workdays with no entry at all ("missing
// check-in"), and days where a check-in was logged but never checked out.
function computeMonthFlags(attendanceObj, settings, todayStr) {
  const monthPrefix = todayStr.slice(0, 7);
  const startBound = (settings.startDate && settings.startDate.slice(0, 7) === monthPrefix) ? settings.startDate : monthPrefix + '-01';
  const missingCheckIn = [];
  const missingCheckOut = [];
  let cur = new Date(startBound + 'T00:00:00');
  const todayDate = new Date(todayStr + 'T00:00:00');
  while (cur < todayDate) {
    const ds = toDateStr(cur);
    const entry = attendanceObj[ds];
    const dt = getDayType(ds, settings);
    if (!entry) {
      if (dt === 'workday') missingCheckIn.push(ds);
    } else if (entry.checkIn && !entry.checkOut && entry.status !== 'leave' && entry.status !== 'medical_leave') {
      missingCheckOut.push(ds);
    }
    cur.setDate(cur.getDate() + 1);
  }
  return { missingCheckIn, missingCheckOut };
}

function csvEscape(v) {
  const s = String(v === undefined || v === null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// App Check: verifies requests actually come from this page (not a script
// hitting Firebase directly with the public config above). Get your site key
const db = firebase.firestore();
const auth = firebase.auth();

async function apiGet(key, setSync) {
  try {
    if (setSync) setSync('busy');
    const doc = await db.collection('driverlog').doc(key).get();
    if (setSync) setSync('ok');
    if (!doc.exists) return null;
    return JSON.parse(doc.data().value);
  } catch (e) {
    console.error('[Driver Log] Firestore read failed for key "' + key + '":', e);
    if (setSync) setSync('err');
    return null;
  }
}
async function apiSet(key, val, setSync) {
  try {
    if (setSync) setSync('busy');
    await db.collection('driverlog').doc(key).set({ value: JSON.stringify(val) });
    if (setSync) setSync('ok');
    return true;
  } catch (e) {
    console.error('[Driver Log] Firestore write failed for key "' + key + '":', e);
    if (setSync) setSync('err');
    return false;
  }
}

// ---------- login screen ----------
function Login({ onDriver, onAdmin }) {
  const [driverPw, setDriverPw] = useState('');
  const [driverErr, setDriverErr] = useState('');
  const [driverBusy, setDriverBusy] = useState(false);

  const [showAdmin, setShowAdmin] = useState(false);
  const [adminPw, setAdminPw] = useState('');
  const [adminErr, setAdminErr] = useState('');
  const [adminBusy, setAdminBusy] = useState(false);

  async function signInDriver() {
    if (!driverPw) return;
    setDriverErr(''); setDriverBusy(true);
    try {
      await auth.signInWithEmailAndPassword(DRIVER_EMAIL, driverPw);
      onDriver();
    } catch (e) {
      setDriverErr('Incorrect password.');
    }
    setDriverBusy(false);
  }
  async function signInAdmin() {
    if (!adminPw) return;
    setAdminErr(''); setAdminBusy(true);
    try {
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, adminPw);
      onAdmin();
    } catch (e) {
      setAdminErr('Incorrect password.');
    }
    setAdminBusy(false);
  }

  return (
    <div className="dl-login-screen">
      <style>{CSS}</style>
      <div className="dl-login-card">
        <div className="dl-company">Qvirtue Sdn Bhd</div>
        <div className="dl-login-mark">Driver Log<span className="dot">.</span></div>
        <div className="dl-login-sub">Daily check-in, trips and OT</div>

        <div className="dl-login-admin-box" style={{ marginTop: 6 }}>
          <input
            type="password"
            placeholder="Irham's password"
            value={driverPw}
            onChange={e => { setDriverPw(e.target.value); setDriverErr(''); }}
            onKeyDown={e => { if (e.key === 'Enter') signInDriver(); }}
          />
          <button className="dl-login-btn driver" style={{ marginTop: 0 }} disabled={driverBusy} onClick={signInDriver}>
            {driverBusy ? 'Signing in…' : 'Sign in as Irham (Driver)'}
          </button>
          {driverErr && <div className="dl-login-err">{driverErr}</div>}
        </div>

        {!showAdmin ? (
          <button className="dl-login-btn admin" onClick={() => setShowAdmin(true)}>Administrator login</button>
        ) : (
          <div className="dl-login-admin-box">
            <input
              type="password"
              placeholder="Admin password"

              {adminBusy ? 'Signing in…' : 'Sign in'}
            </button>
            {adminErr && <div className="dl-login-err">{adminErr}</div>}
          </div>
        )}

        <div className="dl-login-foot">Shared logbook — check-ins and trips are visible only to authorized users.</div>
      </div>
    </div>
  );
}

function DriverLog() {
  const today = useRef(todayInKL()).current;
  const [syncStatus, setSyncStatus] = useState('busy');
  const [appStage, setAppStage] = useState('login'); // 'login' | 'app'
  const [activeTab, setActiveTab] = useState('today');
  const [settings, setSettingsState] = useState(DEFAULT_SETTINGS);
  const [currentRole, setCurrentRole] = useState('driver');
  const isAdmin = currentRole === 'admin';

  const [attendanceCache, setAttendanceCache] = useState({}); // monthKey -> { date: entry }
  const [todayEntry, setTodayEntry] = useState({});
  const [remarkDraft, setRemarkDraft] = useState('');
  const [recentDays, setRecentDays] = useState([]);

  const [trips, setTrips] = useState([]);
  const [tripForm, setTripForm] = useState({ date: toDateStr(today), notes: '' });

  // Admin keeps a separate trip log — used to cross-check against Irham's
  // own entries when running reports, not part of his OT/pay calculations.
  const [adminTrips, setAdminTrips] = useState([]);
  const [adminTripForm, setAdminTripForm] = useState({ date: toDateStr(today), timeIn: '', timeOut: '', notes: '' });

  // Backfilling Irham's OWN trip log (past months) — separate from admin's
  // own cross-check records above.
  const [backfillTripDate, setBackfillTripDate] = useState(toDateStr(today));
  const [backfillTripForm, setBackfillTripForm] = useState({ timeIn: '', timeOut: '', notes: '' });
  const [backfillTripMonthList, setBackfillTripMonthList] = useState([]);

  const [reportMonthDate, setReportMonthDate] = useState(todayInKL());
  const [reportAttendance, setReportAttendance] = useState({});
  const [reportTrips, setReportTrips] = useState([]);
  const [copyNote, setCopyNote] = useState('');
  const [exportNote, setExportNote] = useState('');
  const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const [exportFrom, setExportFrom] = useState(toDateStr(firstOfMonth));
  const [exportTo, setExportTo] = useState(toDateStr(today));

  const [settingsDraft, setSettingsDraft] = useState(DEFAULT_SETTINGS);
  const [phDate, setPhDate] = useState('');
  const [phName, setPhName] = useState('');
  const [settingsSaveNote, setSettingsSaveNote] = useState('');

  const [attDate, setAttDate] = useState(toDateStr(today));
  const [attForm, setAttForm] = useState({ checkIn: '', checkOut: '', status: 'present', remark: '' });
  const [attSaveNote, setAttSaveNote] = useState('');

  const dateStr = toDateStr(today);
  const monthKey = toMonthKey(today);

  const loadAttendanceMonth = useCallback(async (mk) => {
    if (attendanceCache[mk]) return attendanceCache[mk];
    const d = (await apiGet('attendance:' + mk, setSyncStatus)) || {};
    setAttendanceCache(prev => ({ ...prev, [mk]: d }));
    return d;
  }, [attendanceCache]);

  const saveAttendanceMonth = useCallback(async (mk, data) => {
    setAttendanceCache(prev => ({ ...prev, [mk]: data }));
    await apiSet('attendance:' + mk, data, setSyncStatus);
  }, []);

  const loadMonthArray = useCallback(async (prefix, mk) => {
    const d = await apiGet(prefix + ':' + mk, setSyncStatus);
    return d || [];
  }, []);
  const saveMonthArray = useCallback(async (prefix, mk, arr) => {
    await apiSet(prefix + ':' + mk, arr, setSyncStatus);
  }, []);

  // ---------- init ----------
  useEffect(() => {
    (async () => {
      const s = await apiGet('settings', setSyncStatus);
      const merged = s ? { ...DEFAULT_SETTINGS, ...s } : DEFAULT_SETTINGS;
      setSettingsState(merged);
      setSettingsDraft(merged);

      const att = await loadAttendanceMonth(monthKey);
      setTodayEntry(att[dateStr] || {});
      setRemarkDraft((att[dateStr] || {}).remark || '');

      await refreshRecentDays(merged);
      const tr = await loadMonthArray('trips', monthKey);
      setTrips(tr);
      const adt = await loadMonthArray('admin_trips', monthKey);
      setAdminTrips(adt);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function refreshRecentDays(settingsForCalc) {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    const monthsNeeded = [...new Set(days.map(toMonthKey))];
    const monthData = {};
    for (const mk of monthsNeeded) monthData[mk] = await loadAttendanceMonth(mk);
    const rows = days.map(d => {
      const ds = toDateStr(d);
      const mk = toMonthKey(d);
      const entry = monthData[mk][ds];
      if (!entry) return null;
      return { date: d, dateStr: ds, entry, calc: computeDay(ds, entry, settingsForCalc || settings) };
    }).filter(Boolean);
    setRecentDays(rows);
  }

  // ---------- today actions ----------
  async function persistTodayEntry(nextEntry) {
    setTodayEntry(nextEntry);
    const att = await loadAttendanceMonth(monthKey);
    const updated = { ...att, [dateStr]: nextEntry };
    await saveAttendanceMonth(monthKey, updated);
    refreshRecentDays();
  }

  function handleCheckIn() {
    const kl = nowInKL();
    const time = kl.hh + ':' + kl.mm;
    const next = { ...todayEntry, checkIn: time, enteredBy: CURRENT_USER };
    persistTodayEntry(next);
  }
  function handleCheckOut() {
    const kl = nowInKL();
    const time = kl.hh + ':' + kl.mm;
    const next = { ...todayEntry, checkOut: time, enteredBy: CURRENT_USER };
    persistTodayEntry(next);
  }
  function handleStatusChange(status) {
    const next = { ...todayEntry, status, enteredBy: CURRENT_USER };
    persistTodayEntry(next);
  }
  function handleRemarkBlur() {
    const next = { ...todayEntry, remark: remarkDraft.trim(), enteredBy: CURRENT_USER };
    persistTodayEntry(next);
  }

  // ---------- trips ----------
  async function handleTripSubmit(e) {
    e.preventDefault();
    if (!isAdmin && tripForm.date !== dateStr) return; // drivers can only log trips for today
    const mk = monthKeyFromDateStr(tripForm.date);
    const trip = {
      id: genId(),
      date: tripForm.date,
      timeIn: todayEntry.checkIn || '',
      timeOut: todayEntry.checkOut || '',
      notes: tripForm.notes,
      enteredBy: CURRENT_USER
    };
    const arr = await loadMonthArray('trips', mk);
    const nextArr = [...arr, trip];
    await saveMonthArray('trips', mk, nextArr);
    if (mk === monthKey) setTrips(nextArr);
    setTripForm({ date: toDateStr(today), notes: '' });
  }
  async function handleDeleteTrip(id) {
    const arr = await loadMonthArray('trips', monthKey);
    const target = arr.find(t => t.id === id);
    if (target && !isAdmin && target.date !== dateStr) return; // drivers can't remove past records
    const nextArr = arr.filter(t => t.id !== id);
    await saveMonthArray('trips', monthKey, nextArr);
    setTrips(nextArr);
  }

  // ---------- admin's own trip records (separate from Irham's log) ----------
  async function handleAdminTripSubmit(e) {
    e.preventDefault();
    if (!isAdmin) return;
    const mk = monthKeyFromDateStr(adminTripForm.date);
    const rec = {
      id: genId(), date: adminTripForm.date, timeIn: adminTripForm.timeIn,
      timeOut: adminTripForm.timeOut, notes: adminTripForm.notes,
      enteredBy: 'Admin'
    };
    const arr = await loadMonthArray('admin_trips', mk);
    const nextArr = [...arr, rec];
    await saveMonthArray('admin_trips', mk, nextArr);
    if (mk === monthKey) setAdminTrips(nextArr);
    setAdminTripForm({ date: toDateStr(today), timeIn: '', timeOut: '', notes: '' });
  }
  async function handleDeleteAdminTrip(id) {
    if (!isAdmin) return;
    const arr = await loadMonthArray('admin_trips', monthKey);
    const nextArr = arr.filter(t => t.id !== id);
    await saveMonthArray('admin_trips', monthKey, nextArr);
    setAdminTrips(nextArr);
  }

  // ---------- backfill Irham's own trip log (any past date) ----------
  async function loadBackfillTripMonth(ds) {
    const mk = monthKeyFromDateStr(ds);
    const arr = await loadMonthArray('trips', mk);
    setBackfillTripMonthList(arr);
  }
  useEffect(() => {
    if (!isAdmin) return;
    loadBackfillTripMonth(backfillTripDate);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [backfillTripDate, isAdmin]);

    e.preventDefault();
    if (!isAdmin) return;
    const mk = monthKeyFromDateStr(backfillTripDate);
    const trip = {

    setBackfillTripForm({ timeIn: '', timeOut: '', notes: '' });

  async function handleDeleteBackfillTrip(id) {
    if (!isAdmin) return;
    const mk = monthKeyFromDateStr(backfillTripDate);
    const arr = await loadMonthArray('trips', mk);
    const nextArr = arr.filter(t => t.id !== id);
    await saveMonthArray('trips', mk, nextArr);
    if (mk === monthKey) setTrips(nextArr);
    setBackfillTripMonthList(nextArr);
  }

  // ---------- reports & dashboard summaries ----------
  const loadReport = useCallback(async (mDate) => {
    const mk = toMonthKey(mDate);
    const att = await loadAttendanceMonth(mk);
    const tr = await loadMonthArray('trips', mk);
    setReportAttendance(att);
    setReportTrips(tr);
  }, [loadAttendanceMonth, loadMonthArray]);

  useEffect(() => { loadReport(reportMonthDate); }, [reportMonthDate, loadReport]);

  function shiftReportMonth(delta) {
    const d = new Date(reportMonthDate);
    d.setMonth(d.getMonth() + delta);
    setReportMonthDate(d);
  }

  function buildSummaryFor(attendanceObj, tripsArr) {
    let workedDays = 0, totalHours = 0, workdayOtPay = 0, restOtPay = 0, phOtPay = 0, leaveDays = 0, medicalDays = 0;
    const dailyRows = [];
    Object.keys(attendanceObj).sort().forEach(ds => {
      const entry = attendanceObj[ds];
      const calc = computeDay(ds, entry, settings);
      if (!calc) return;
      if (calc.status === 'leave') leaveDays++;
      else if (calc.status === 'medical_leave') medicalDays++;
      else {
        workedDays++;
        totalHours += calc.worked;
        if (calc.dayType === 'workday') workdayOtPay += calc.otPay;
        else if (calc.dayType === 'rest_day') restOtPay += calc.otPay;
        else phOtPay += calc.otPay;
      }
      dailyRows.push({ dateStr: ds, entry, calc });
    });
    const totalOtPay = workdayOtPay + restOtPay + phOtPay;
    return { workedDays, totalHours, workdayOtPay, restOtPay, phOtPay, totalOtPay, leaveDays, medicalDays, dailyRows };
  }
  function buildReportSummary() {
    return buildSummaryFor(reportAttendance, reportTrips);
  }

  function buildReportText(summary) {
    const label = reportMonthDate.toLocaleDateString('en-MY', { year: 'numeric', month: 'long' });
    const lines = [];
    lines.push('Qvirtue Sdn Bhd — Driver Log');
    lines.push(label);
    lines.push('');
    lines.push('Days worked: ' + summary.workedDays);
    lines.push('Total hours: ' + fmtHrs(summary.totalHours));
    lines.push('Leave days: ' + summary.leaveDays + '  Medical leave days: ' + summary.medicalDays);
    const baseSalary = proratedBaseSalary(reportMonthDate, settings);
    lines.push('Base salary: ' + (settings.monthlySalary ? fmtMoney(baseSalary) + (isProratedMonth(reportMonthDate, settings) ? ' (pro-rated)' : '') : 'not set'));
    lines.push('Workday OT: ' + fmtMoney(summary.workdayOtPay));
    lines.push('Rest day pay: ' + fmtMoney(summary.restOtPay));
    lines.push('Public holiday pay: ' + fmtMoney(summary.phOtPay));
    lines.push('Estimated total pay: ' + (settings.monthlySalary ? fmtMoney(baseSalary + summary.totalOtPay) : 'set salary first'));
    lines.push('');
    lines.push('Trips logged: ' + reportTrips.length);
    lines.push('');
    lines.push('Daily breakdown:');
    summary.dailyRows.forEach(r => {
      const isLeave = r.calc.status === 'leave' || r.calc.status === 'medical_leave';
      if (isLeave) lines.push(r.dateStr + ' [' + dayTypeLabel(r.calc.dayType) + '] ' + statusLabel(r.calc.status));
      else lines.push(r.dateStr + ' [' + dayTypeLabel(r.calc.dayType) + '] ' + r.entry.checkIn + '-' + r.entry.checkOut + ' = ' + fmtHrs(r.calc.worked) + 'h, OT ' + (settings.monthlySalary ? r.calc.otPay.toFixed(2) : '—'));
    });
    return lines.join('\n');
  }

  async function handleCopyReport() {
    const summary = buildReportSummary();
    const text = buildReportText(summary);
    try {
      await navigator.clipboard.writeText(text);
      setCopyNote('Copied to clipboard.');
    } catch (e) {
      setCopyNote('Could not copy — select and copy manually.');
    }
    setTimeout(() => setCopyNote(''), 2000);
  }

  async function handleExportCsv() {
    if (!exportFrom || !exportTo) { setExportNote('Pick a start and end date first.'); return; }
    if (exportFrom > exportTo) { setExportNote('From date must be before to date.'); return; }

    const fromD = new Date(exportFrom + 'T00:00:00');
    const toD = new Date(exportTo + 'T00:00:00');
    const monthKeys = new Set();
    let cur = new Date(fromD.getFullYear(), fromD.getMonth(), 1);
    while (cur <= toD) { monthKeys.add(toMonthKey(cur)); cur.setMonth(cur.getMonth() + 1); }

    const attByMonth = {};
    const tripsByMonth = {};
    const adminTripsByMonth = {};
    for (const mk of monthKeys) {
      attByMonth[mk] = await loadAttendanceMonth(mk);
      tripsByMonth[mk] = await loadMonthArray('trips', mk);
      adminTripsByMonth[mk] = await loadMonthArray('admin_trips', mk);
    }

    const rows = [];
    rows.push(['Qvirtue Sdn Bhd — Driver Log export']);
    rows.push(['Date range', exportFrom + ' to ' + exportTo]);
    rows.push([]);
    rows.push(['ATTENDANCE']);
    rows.push(['Date', 'Day', 'Day type', 'Status', 'Check in', 'Check out', 'Hours worked', 'OT hours', 'OT pay (RM)', 'Remark']);

    // Walk every calendar day in the range (not just days with an entry) so
    // missing check-ins and incomplete check-outs are exported too.
    for (let d = new Date(fromD); d <= toD; d.setDate(d.getDate() + 1)) {
      const ds = toDateStr(d);
      const mk = monthKeyFromDateStr(ds);
      const att = attByMonth[mk] || {};
      const entry = att[ds];
      const dType = getDayType(ds, settings);
      const dayLabel = d.toLocaleDateString('en-MY', { weekday: 'short' });

      if (!entry) {
        if (dType === 'workday') {
          rows.push([ds, dayLabel, dayTypeLabel(dType), 'Missing check-in', '', '', '', '', '', '']);
        }
        continue;
      }

      const calc = computeDay(ds, entry, settings);
      if (!calc) {
        // Entry exists (checked in) but never checked out.
        rows.push([ds, dayLabel, dayTypeLabel(dType), 'Missing check-out', entry.checkIn || '', '', '', '', '', entry.remark || '']);
        continue;
      }
      const isLeave = calc.status === 'leave' || calc.status === 'medical_leave';
      rows.push([
        ds,
        dayLabel,
        dayTypeLabel(calc.dayType),
        statusLabel(calc.status),
        isLeave ? '' : (entry.checkIn || ''),
        isLeave ? '' : (entry.checkOut || ''),
        isLeave ? '' : fmtHrs(calc.worked),
        isLeave ? '' : fmtHrs(calc.otHours),
        isLeave ? '' : (settings.monthlySalary ? calc.otPay.toFixed(2) : ''),
        entry.remark || ''
      ]);
    }

    rows.push([]);
    rows.push(["IRHAM'S TRIPS"]);
    rows.push(['Date', 'Day', 'Time in', 'Time out', 'Notes']);
    Object.keys(tripsByMonth).sort().forEach(mk => {
      tripsByMonth[mk]
        .filter(t => t.date >= exportFrom && t.date <= exportTo)
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach(t => {
          const dayLabel = new Date(t.date + 'T00:00:00').toLocaleDateString('en-MY', { weekday: 'short' });
          rows.push([t.date, dayLabel, t.timeIn || '', t.timeOut || '', t.notes || '']);
        });
    });

    rows.push([]);
    rows.push(['ADMIN TRIP RECORDS']);
    rows.push(['Date', 'Day', 'Time in', 'Time out', 'Notes']);
    Object.keys(adminTripsByMonth).sort().forEach(mk => {
      adminTripsByMonth[mk]
        .filter(t => t.date >= exportFrom && t.date <= exportTo)
        .sort((a, b) => (a.date + (a.timeIn || '')).localeCompare(b.date + (b.timeIn || '')))
        .forEach(t => {
          const dayLabel = new Date(t.date + 'T00:00:00').toLocaleDateString('en-MY', { weekday: 'short' });
          rows.push([t.date, dayLabel, t.timeIn || '', t.timeOut || '', t.notes || '']);
        });
    });

    const csvContent = rows.map(r => r.map(csvEscape).join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'qvirtue-driver-log_' + exportFrom + '_to_' + exportTo + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setExportNote('Exported.');
    setTimeout(() => setExportNote(''), 2000);
  }

  // ---------- login / logout ----------
  function handleLoginDriver() {
    setCurrentRole('driver');
    setAppStage('app');
    setActiveTab('today');
  }
  function handleLoginAdmin() {
    setCurrentRole('admin');
    setAppStage('app');
    setActiveTab('dashboard');
  }
  function handleLogout() {
    auth.signOut();
    setAppStage('login');
    setActiveTab('today');
  }

  // Stay signed in across visits (Firebase persists the session in the
  // browser), so Irham and the admin don't have to re-enter their password
  // every time they open the app from their home screen icon.
  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged(user => {
      if (user && user.email === DRIVER_EMAIL) handleLoginDriver();
      else if (user && user.email === ADMIN_EMAIL) handleLoginAdmin();
    });
    return unsubscribe;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // ---------- settings ----------
  async function handleSaveSettings() {
    const next = {
      ...settings,
      monthlySalary: parseFloat(settingsDraft.monthlySalary) || null,
      startDate: settingsDraft.startDate || settings.startDate,
      standardStart: settingsDraft.standardStart || settings.standardStart,
      standardEnd: settingsDraft.standardEnd || settings.standardEnd,
      breakHours: parseFloat(settingsDraft.breakHours) || 0
    };
    setSettingsState(next);
    setSettingsDraft(next);
    const success = await apiSet('settings', next, setSyncStatus);
    setSettingsSaveNote(success ? 'Saved.' : 'Could not save — check connection and try again.');
    setTimeout(() => setSettingsSaveNote(''), success ? 2000 : 4000);
    refreshRecentDays(next);
  }
  async function handleAddHoliday() {
    if (!phDate) return;
    const next = {
      ...settings,
      publicHolidays: [...settings.publicHolidays, { date: phDate, name: phName || 'Public holiday' }].sort((a, b) => a.date.localeCompare(b.date))
    };
    setSettingsState(next);
    setSettingsDraft(next);
    await apiSet('settings', next, setSyncStatus);
    setPhDate(''); setPhName('');
    refreshRecentDays(next);
  }
  async function handleDeleteHoliday(date) {
    const next = { ...settings, publicHolidays: settings.publicHolidays.filter(p => p.date !== date) };
    setSettingsState(next);
    setSettingsDraft(next);
    await apiSet('settings', next, setSyncStatus);
    refreshRecentDays(next);
  }

  // ---------- manual attendance entry (backfill / correction) ----------
  useEffect(() => {
    if (!isAdmin) return;
    (async () => {
      const mk = monthKeyFromDateStr(attDate);
      const att = await loadAttendanceMonth(mk);
      const e = att[attDate] || {};
      setAttForm({
        checkIn: e.checkIn || '',
        checkOut: e.checkOut || '',
        status: e.status || 'present',
        remark: e.remark || ''
      });
      setAttSaveNote('');
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [attDate, isAdmin]);

  async function handleSaveAttendanceEntry() {
    const ds = attDate;
    const mk = monthKeyFromDateStr(ds);
    const att = await loadAttendanceMonth(mk);
    const entry = { status: attForm.status, enteredBy: 'Admin (manual entry)' };
    if (attForm.status === 'present') {
      if (attForm.checkIn) entry.checkIn = attForm.checkIn;
      if (attForm.checkOut) entry.checkOut = attForm.checkOut;
    }
    if (attForm.remark) entry.remark = attForm.remark;

    const updated = { ...att, [ds]: entry };
    await saveAttendanceMonth(mk, updated);
    if (ds === dateStr) {
      setTodayEntry(entry);
      setRemarkDraft(entry.remark || '');
    }
    refreshRecentDays();
    setAttSaveNote('Saved ' + ds + '.');
    setTimeout(() => setAttSaveNote(''), 2000);
  }

  async function handleClearAttendanceEntry() {
    const ds = attDate;
    const mk = monthKeyFromDateStr(ds);
    const att = await loadAttendanceMonth(mk);
    const updated = { ...att };
    delete updated[ds];
    await saveAttendanceMonth(mk, updated);
    setAttForm({ checkIn: '', checkOut: '', status: 'present', remark: '' });
    if (ds === dateStr) { setTodayEntry({}); setRemarkDraft(''); }
    refreshRecentDays();
    setAttSaveNote('Cleared ' + ds + '.');
    setTimeout(() => setAttSaveNote(''), 2000);
  }

  // ---------- derived ----------
  const dt = getDayType(dateStr, settings);
  const status = todayEntry.status || 'present';
  const calc = computeDay(dateStr, todayEntry, settings);
  const reportSummary = buildReportSummary();

  const monthAttendanceForDash = attendanceCache[monthKey] || {};
  const dashSummary = buildSummaryFor(monthAttendanceForDash, trips);
  const dashFlags = computeMonthFlags(monthAttendanceForDash, settings, dateStr);

  if (appStage === 'login') {
    return <Login onDriver={handleLoginDriver} onAdmin={handleLoginAdmin} />;
  }

  return (
    <div className="dl-app">
      <style>{CSS}</style>

      <header className="dl-header">
        <div className="dl-top-row">
          <div>
            <div className="dl-company">Qvirtue Sdn Bhd</div>
            <div className="dl-mark">Driver Log<span className="dot">.</span></div>
            <div className="dl-sub">Daily check-in, trips and OT</div>
          </div>
          <div className="dl-header-right">
            <span className={"dl-sync-badge " + (syncStatus === 'ok' ? 'ok' : syncStatus === 'err' ? 'err' : '')}>
              {syncStatus === 'ok' ? 'Synced' : syncStatus === 'err' ? 'Offline — check connection' : 'Syncing…'}
            </span>
            <div className="dl-role-row">
              <span className="dl-role-tag">{isAdmin ? 'Administrator' : 'Irham · Driver'}</span>
              <button className="dl-logout-btn" onClick={() => window.location.reload()} title="Reload the page">↻ Refresh</button>
              <button className="dl-logout-btn" onClick={handleLogout}>Log out</button>
            </div>
          </div>
        </div>
        <nav className="dl-tabs">
          {(isAdmin ? ['dashboard', 'attendance', 'trips', 'reports', 'settings'] : ['today', 'trips']).map(tab => (
            <button key={tab} className={activeTab === tab ? 'active' : ''} onClick={() => setActiveTab(tab)}>
              {tab === 'today' ? 'Today' : tab === 'dashboard' ? 'Dashboard' : tab === 'attendance' ? 'Attendance' : tab === 'trips' ? 'Trips' : tab === 'reports' ? 'Reports' : 'Settings'}
            </button>
          ))}
        </nav>
      </header>

      <main className="dl-main">

        {activeTab === 'dashboard' && (
          <section>
            <div className="dl-odometer">
              <div className="dl-odo-item"><div className="n">{todayEntry.checkIn ? (todayEntry.checkOut ? 'Done' : 'In progress') : 'Not started'}</div><div className="l">Irham today</div></div>
              <div className="dl-odo-item"><div className="n">{calc ? fmtHrs(calc.worked) : '—'}</div><div className="l">Hours today</div></div>
              <div className="dl-odo-item"><div className="n">{dashSummary.workedDays}</div><div className="l">Days worked</div></div>
              <div className="dl-odo-item"><div className="n">{settings.monthlySalary ? fmtMoney(proratedBaseSalary(today, settings) + dashSummary.totalOtPay) : '—'}</div><div className="l">Est. pay (month){isProratedMonth(today, settings) ? ' · pro-rated' : ''}</div></div>
            </div>

            <div className="dl-card">
              <div className="dl-row-between">
                <h2 style={{ marginBottom: 0 }}>Records needing review</h2>
                {(dashFlags.missingCheckIn.length + dashFlags.missingCheckOut.length) > 0 && (
                  <span className="dl-badge flag">{dashFlags.missingCheckIn.length + dashFlags.missingCheckOut.length} flagged</span>
                )}
              </div>
              <div style={{ marginTop: 8 }}>
                {dashFlags.missingCheckOut.length === 0 && dashFlags.missingCheckIn.length === 0 && (
                  <div className="dl-empty-note">Nothing flagged — all caught up this month.</div>
                )}
                {[
                  ...dashFlags.missingCheckOut.map(ds => ({ ds, label: 'check-in logged, no check-out' })),
                  ...dashFlags.missingCheckIn.map(ds => ({ ds, label: 'no check-in recorded' }))
                ].sort((a, b) => b.ds.localeCompare(a.ds)).slice(0, 3).map(f => (
                  <div className="dl-flag-row" key={f.ds + f.label}>
                    <div className="dl-flag-main"><span className="dl-flag-dot"></span>{prettyLabel(f.ds)} — {f.label}</div>
                    <span className="dl-badge flag">Review</span>
                  </div>
                ))}
              </div>
              {(dashFlags.missingCheckIn.length + dashFlags.missingCheckOut.length) > 3 && (
                <div className="dl-hint">Showing the 3 most recent of {dashFlags.missingCheckIn.length + dashFlags.missingCheckOut.length} flagged records this month. The full list is included in CSV exports.</div>
              )}
              <div className="dl-hint">Attendance is a shared logbook, so corrections happen directly on the Today tab as Irham. This list simply flags what still needs a fix.</div>
            </div>

            <div className="dl-card">
              <h2>This month at a glance</h2>
              <table className="dl-breakdown-table">
                <tbody>
                  <tr><td>Leave days</td><td className="num">{dashSummary.leaveDays}</td></tr>
                  <tr><td>Medical leave days</td><td className="num">{dashSummary.medicalDays}</td></tr>
                  <tr><td>Workday OT</td><td className="num">{fmtMoney(dashSummary.workdayOtPay)}</td></tr>
                  <tr><td>Rest day pay</td><td className="num">{fmtMoney(dashSummary.restOtPay)}</td></tr>
                  <tr><td>Public holiday pay</td><td className="num">{fmtMoney(dashSummary.phOtPay)}</td></tr>
                  <tr><td>Trips logged</td><td className="num">{trips.length}</td></tr>
                </tbody>
              </table>
            </div>

            <div className="dl-card">
              <h2>Quick links</h2>
              <div className="dl-quick-links">
                <button className="dl-btn-primary" onClick={() => setActiveTab('attendance')}>Backfill attendance</button>
                <button className="dl-btn-primary" onClick={() => setActiveTab('reports')}>Open reports</button>
                <button className="dl-btn-primary" onClick={() => setActiveTab('trips')}>Review trips</button>
                <button className="dl-btn-primary" onClick={() => setActiveTab('settings')}>Manage settings</button>
              </div>
            </div>
          </section>
        )}

        {activeTab === 'attendance' && (
          <section>
            <div className="dl-card">
              <h2>Manual attendance entry</h2>
              <div className="dl-hint" style={{ marginBottom: 12 }}>
                Use this to backfill or correct a check-in/check-out for any date — e.g. entering July's records by hand so OT reports are accurate.
              </div>
              <div className="dl-field-row">
                <div className="dl-field"><label>Date</label><input type="date" value={attDate} onChange={e => setAttDate(e.target.value)} /></div>
                <div className="dl-field">
                  <label>Status</label>
                  <select value={attForm.status} onChange={e => setAttForm(f => ({ ...f, status: e.target.value }))}>
                    <option value="present">Present</option>
                    <option value="leave">On leave</option>
                    <option value="medical_leave">Medical leave</option>
                  </select>
                </div>
              </div>
              {attForm.status === 'present' && (
                <div className="dl-field-row">
                  <div className="dl-field"><label>Check-in</label><input type="time" value={attForm.checkIn} onChange={e => setAttForm(f => ({ ...f, checkIn: e.target.value }))} /></div>
                  <div className="dl-field"><label>Check-out</label><input type="time" value={attForm.checkOut} onChange={e => setAttForm(f => ({ ...f, checkOut: e.target.value }))} /></div>
                </div>
              )}
              <div className="dl-field" style={{ marginTop: 10 }}>
                <label>Remark</label>
                <input type="text" placeholder="Optional" value={attForm.remark} onChange={e => setAttForm(f => ({ ...f, remark: e.target.value }))} />
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                <button className="dl-btn-primary" onClick={handleSaveAttendanceEntry}>Save this day</button>
                <button className="qdl-btn" style={{ background: '#F7E7E1', color: '#B4472A', border: 'none', borderRadius: 7, padding: '10px 14px', fontWeight: 600, fontSize: 13.5, cursor: 'pointer' }} onClick={handleClearAttendanceEntry}>Clear this day</button>
              </div>
              <div className="dl-save-note">{attSaveNote}</div>
            </div>

            <div className="dl-card">
              <h2>{new Date(attDate + 'T00:00:00').toLocaleDateString('en-MY', { month: 'long', year: 'numeric' })} — entries so far</h2>
              {(() => {
                const mk = monthKeyFromDateStr(attDate);
                const monthData = attendanceCache[mk] || {};
                const rows = Object.keys(monthData).sort().map(ds => ({ dateStr: ds, entry: monthData[ds], calc: computeDay(ds, monthData[ds], settings) }));
                if (rows.length === 0) return <div className="dl-empty-note">No entries saved for this month yet.</div>;
                return (
                  <div style={{ overflowX: 'auto' }}>
                    <table className="dl-breakdown-table">
                      <thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th className="num">Hrs</th><th></th></tr></thead>
                      <tbody>
                        {rows.map(r => {
                          const isLeave = r.entry.status === 'leave' || r.entry.status === 'medical_leave';
                          return (
                            <tr key={r.dateStr}>
                              <td>{r.dateStr}</td>
                              <td>{statusLabel(r.entry.status || 'present')}</td>
                              <td>{isLeave ? '—' : (r.entry.checkIn || '—')}</td>
                              <td>{isLeave ? '—' : (r.entry.checkOut || '—')}</td>
                              <td className="num">{(r.calc && !isLeave) ? fmtHrs(r.calc.worked) : '—'}</td>
                              <td><button className="dl-log-del" onClick={() => setAttDate(r.dateStr)} aria-label="Edit this day">✎</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                );
              })()}
            </div>
          </section>
        )}

        {activeTab === 'today' && (
          <section>
            <div className="dl-card">
              <div className="dl-row-between">
                <div>
                  <div className="dl-today-date">{today.toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                  <div className="dl-today-day">{today.toLocaleDateString('en-MY', { weekday: 'long' })}</div>
                </div>
                <span className={"dl-badge " + dt}>{dayTypeLabel(dt)}</span>
              </div>

              <div className="dl-punch-grid">
                <div className="dl-punch-box">
                  <div className="lbl">Check in</div>
                  <div className={"val" + (!todayEntry.checkIn ? ' empty' : '')}>{todayEntry.checkIn || '—'}</div>
                  <button
                    className={status !== 'present' ? 'dl-btn-disabled' : 'dl-btn-in'}
                    disabled={status !== 'present'}
                    onClick={handleCheckIn}
                  >{todayEntry.checkIn ? 'Update check-in' : 'Check in now'}</button>
                </div>
                <div className="dl-punch-box">
                  <div className="lbl">Check out</div>
                  <div className={"val" + (!todayEntry.checkOut ? ' empty' : '')}>{todayEntry.checkOut || '—'}</div>
                  <button
                    className={status !== 'present' ? 'dl-btn-disabled' : 'dl-btn-out'}
                    disabled={status !== 'present'}
                    onClick={handleCheckOut}
                  >{todayEntry.checkOut ? 'Update check-out' : 'Check out now'}</button>
                </div>
              </div>

              <div className="dl-status-row">
                <button className={"dl-status-btn" + (status === 'present' ? ' active' : '')} onClick={() => handleStatusChange('present')}>Present</button>
                <button className={"dl-status-btn" + (status === 'leave' ? ' active leave' : '')} onClick={() => handleStatusChange('leave')}>On leave</button>
                <button className={"dl-status-btn" + (status === 'medical_leave' ? ' active medical' : '')} onClick={() => handleStatusChange('medical_leave')}>Medical leave</button>
              </div>

              <div className="dl-field" style={{ marginTop: 12 }}>
                <label>Remark / note</label>
                <input
                  type="text"
                  value={remarkDraft}
                  placeholder="Optional — e.g. late due to traffic"
                  onChange={e => setRemarkDraft(e.target.value)}
                  onBlur={handleRemarkBlur}
                />
              </div>

              {status === 'present' && calc && (
                <div className="dl-today-summary">
                  <div className="dl-stat"><div className="n">{fmtHrs(calc.worked)}</div><div className="l">Hours worked</div></div>
                  <div className="dl-stat"><div className="n">{fmtHrs(calc.otHours)}</div><div className="l">OT hours</div></div>
                  <div className="dl-stat"><div className="n">{settings.monthlySalary ? calc.otPay.toFixed(2) : '—'}</div><div className="l">OT pay (RM)</div></div>
                </div>
              )}
              <div className="dl-hint">
                {status !== 'present'
                  ? statusLabel(status) + ' — no check-in required today.'
                  : calc
                    ? calc.note + (settings.monthlySalary ? '' : ' — set monthly salary in Settings to see pay amounts.')
                    : (todayEntry.checkIn ? "Check out to complete today's log." : "Check in to start today's log.")}
              </div>
            </div>

            <div className="dl-card">
              <h2>Last 7 days</h2>
              {recentDays.length === 0 && <div className="dl-empty-note">No check-ins in the last 7 days.</div>}
              {recentDays.map((r, i) => {
                const isLeave = r.entry.status === 'leave' || r.entry.status === 'medical_leave';
                return (
                  <div className="dl-log-row" key={i}>
                    <div className="dl-log-idx">{pad(r.date.getDate())}</div>
                    <div className="dl-log-main">
                      <div className="t1">
                        {r.date.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric', month: 'short' })}
                        <span className={"dl-badge " + getDayType(r.dateStr, settings)} style={{ marginLeft: 6 }}>{dayTypeLabel(getDayType(r.dateStr, settings))}</span>
                      </div>
                      <div className="t2">
                        {isLeave ? statusLabel(r.entry.status) : (r.entry.checkIn || '—') + ' → ' + (r.entry.checkOut || '—')}
                        {r.entry.remark ? ' · ' + r.entry.remark : ''}
                      </div>
                    </div>
                    <div className="dl-log-amt">{(r.calc && !isLeave) ? fmtHrs(r.calc.worked) + 'h' : ''}</div>
                  </div>
                );
              })}
            </div>
          </section>
        )}

        {activeTab === 'trips' && isAdmin && (
          <section>
            <div className="dl-card">
              <h2>Admin trip records</h2>
              <div className="dl-hint" style={{ marginBottom: 12 }}>
                Your own record of trips — kept separately from Irham's log — used to cross-check his entries later when running reports.
              </div>
              <form className="dl-form" onSubmit={handleAdminTripSubmit}>
                <div className="dl-field-row">
                  <div className="dl-field"><label>Date</label><input type="date" required value={adminTripForm.date} onChange={e => setAdminTripForm(f => ({ ...f, date: e.target.value }))} /></div>
                </div>
                <div className="dl-field-row">
                  <div className="dl-field"><label>Time in</label><input type="time" value={adminTripForm.timeIn} onChange={e => setAdminTripForm(f => ({ ...f, timeIn: e.target.value }))} /></div>
                  <div className="dl-field"><label>Time out</label><input type="time" value={adminTripForm.timeOut} onChange={e => setAdminTripForm(f => ({ ...f, timeOut: e.target.value }))} /></div>
                </div>
                <div className="dl-field"><label>Notes</label><input type="text" placeholder="Optional" value={adminTripForm.notes} onChange={e => setAdminTripForm(f => ({ ...f, notes: e.target.value }))} /></div>
                <button type="submit" className="dl-btn-primary">Add record</button>
              </form>
            </div>
            <div className="dl-card">
              <h2>Records this month</h2>
              {adminTrips.length === 0 ? <div className="dl-empty-note">No records logged yet.</div> : (
                <>
                  {[...adminTrips].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 7).map((t, i) => (
                    <div className="dl-log-row" key={t.id}>
                      <div className="dl-log-idx">{i + 1}</div>
                      <div className="dl-log-main">
                        <div className="t1">{t.timeIn || '—'} → {t.timeOut || '—'}</div>
                        <div className="t2">{t.date}{t.notes ? ' · ' + t.notes : ''}</div>
                      </div>
                      <button className="dl-log-del" onClick={() => handleDeleteAdminTrip(t.id)} aria-label="Delete record">&times;</button>
                    </div>
                  ))}
                  {adminTrips.length > 7 && (
                    <div className="dl-hint">Showing the 7 most recent of {adminTrips.length} records this month.</div>
                  )}
                </>
              )}
            </div>

            <div className="dl-card">
              <h2>Backfill Irham's trips</h2>
              <div className="dl-hint" style={{ marginBottom: 12 }}>
                This writes directly into Irham's own trip log — same one he sees on his Trips tab — for any past date. Use this for July and August, or any date he missed logging himself.
              </div>
              <div className="dl-field-row">
                <div className="dl-field"><label>Date</label><input type="date" value={backfillTripDate} onChange={e => setBackfillTripDate(e.target.value)} /></div>
              </div>
              <form className="dl-form" onSubmit={handleBackfillTripSubmit}>
                <div className="dl-field-row">
                  <div className="dl-field"><label>Time in</label><input type="time" value={backfillTripForm.timeIn} onChange={e => setBackfillTripForm(f => ({ ...f, timeIn: e.target.value }))} /></div>
                  <div className="dl-field"><label>Time out</label><input type="time" value={backfillTripForm.timeOut} onChange={e => setBackfillTripForm(f => ({ ...f, timeOut: e.target.value }))} /></div>
                </div>
                <div className="dl-field"><label>Notes</label><input type="text" placeholder="Optional" value={backfillTripForm.notes} onChange={e => setBackfillTripForm(f => ({ ...f, notes: e.target.value }))} /></div>
                <button type="submit" className="dl-btn-primary">Add to Irham's log</button>
              </form>

              <div style={{ marginTop: 16, paddingTop: 12, borderTop: '1px dashed #DBDED9' }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: '#5B6472', marginBottom: 6 }}>
                  {new Date(backfillTripDate + 'T00:00:00').toLocaleDateString('en-MY', { month: 'long', year: 'numeric' })} — Irham's trips so far
                </div>
                {backfillTripMonthList.length === 0 ? <div className="dl-empty-note">No trips logged for this month yet.</div> : (
                  [...backfillTripMonthList].sort((a, b) => a.date.localeCompare(b.date)).map(t => (
                    <div className="dl-log-row" key={t.id}>
                      <div className="dl-log-main">
                        <div className="t1">{t.timeIn || '—'} → {t.timeOut || '—'}</div>
                        <div className="t2">{t.date}{t.notes ? ' · ' + t.notes : ''}{t.enteredBy ? ' · ' + t.enteredBy : ''}</div>
                      </div>
                      <button className="dl-log-del" onClick={() => handleDeleteBackfillTrip(t.id)} aria-label="Delete trip">&times;</button>
                    </div>
                  ))
                )}
              </div>
            </div>
          </section>
        )}

        {activeTab === 'trips' && !isAdmin && (
          <section>
            <div className="dl-card">
              <h2>Log a trip (OT only)</h2>
              <div className="dl-hint" style={{ marginBottom: 12 }}>
                Time in and time out are taken automatically from today's check-in/check-out on the Today tab — just add a note if there's anything worth flagging for OT.
              </div>
              <form className="dl-form" onSubmit={handleTripSubmit}>
                <div className="dl-field-row">
                  <div className="dl-field"><label>Time in</label><input type="text" disabled value={todayEntry.checkIn || 'Not checked in yet'} /></div>
                  <div className="dl-field"><label>Time out</label><input type="text" disabled value={todayEntry.checkOut || 'Not checked out yet'} /></div>
                </div>
                <div className="dl-field"><label>Notes</label><input type="text" placeholder="Optional — e.g. reason for OT" value={tripForm.notes} onChange={e => setTripForm(f => ({ ...f, notes: e.target.value }))} /></div>
                <button type="submit" className="dl-btn-primary">Add trip</button>
              </form>
            </div>
            <div className="dl-card">
              <h2>Trips this month</h2>
              {trips.length === 0 && <div className="dl-empty-note">No trips logged this month.</div>}
              {[...trips].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).map((t, i) => (
                <div className="dl-log-row" key={t.id}>
                  <div className="dl-log-idx">{i + 1}</div>
                  <div className="dl-log-main">
                    <div className="t1">{t.timeIn || '—'} → {t.timeOut || '—'}</div>
                    <div className="t2">{t.date}{t.notes ? ' · ' + t.notes : ''}</div>
                  </div>
                  {t.date === dateStr && (
                    <button className="dl-log-del" onClick={() => handleDeleteTrip(t.id)} aria-label="Delete trip">&times;</button>
                  )}
                </div>
              ))}
            </div>
          </section>
        )}

        {activeTab === 'reports' && isAdmin && (
          <section>
            <div className="dl-month-picker">
              <button onClick={() => shiftReportMonth(-1)}>←</button>
              <div className="m-label">{reportMonthDate.toLocaleDateString('en-MY', { year: 'numeric', month: 'long' })}</div>
              <button onClick={() => shiftReportMonth(1)}>→</button>
            </div>

            <div className="dl-odometer">
              <div className="dl-odo-item"><div className="n">{reportSummary.workedDays}</div><div className="l">Days worked</div></div>
              <div className="dl-odo-item"><div className="n">{fmtHrs(reportSummary.totalHours)}</div><div className="l">Hours worked</div></div>
              <div className="dl-odo-item"><div className="n">{reportSummary.totalOtPay.toFixed(2)}</div><div className="l">OT pay (RM)</div></div>
            </div>

            <div className="dl-card">
              <h2>Pay summary</h2>
              <table className="dl-breakdown-table">
                <tbody>
                  <tr><td>{isProratedMonth(reportMonthDate, settings) ? "Base salary (pro-rated from " + settings.startDate + ')' : 'Base monthly salary'}</td><td className="num">{settings.monthlySalary ? fmtMoney(proratedBaseSalary(reportMonthDate, settings)) : 'Not set'}</td></tr>
                  <tr><td>Workday OT (1.5x)</td><td className="num">{fmtMoney(reportSummary.workdayOtPay)}</td></tr>
                  <tr><td>Rest day pay</td><td className="num">{fmtMoney(reportSummary.restOtPay)}</td></tr>
                  <tr><td>Public holiday pay</td><td className="num">{fmtMoney(reportSummary.phOtPay)}</td></tr>
                  <tr><td><strong>Estimated total pay</strong></td><td className="num"><strong>{settings.monthlySalary ? fmtMoney(proratedBaseSalary(reportMonthDate, settings) + reportSummary.totalOtPay) : 'Set salary in Settings'}</strong></td></tr>
                </tbody>
              </table>
              {!settings.monthlySalary && <div className="dl-hint">Add the monthly salary in Settings to see pay amounts in RM.</div>}
            </div>

            <div className="dl-card">
              <h2>Trips &amp; leave</h2>
              <table className="dl-breakdown-table">
                <tbody>
                  <tr><td>Trips logged</td><td className="num">{reportTrips.length}</td></tr>
                  <tr><td>Leave days</td><td className="num">{reportSummary.leaveDays}</td></tr>
                  <tr><td>Medical leave days</td><td className="num">{reportSummary.medicalDays}</td></tr>
                </tbody>
              </table>
            </div>

            <button className="dl-btn-primary" onClick={handleCopyReport}>Copy report as text</button>
            <div className="dl-save-note">{copyNote}</div>

            <div className="dl-card">
              <h2>Export line items</h2>
              <div className="dl-hint">Exports every check-in, check-out, hours, OT hours and OT amount as a CSV file, for whatever date range you set.</div>
              <div className="dl-field-row" style={{ marginTop: 10 }}>
                <div className="dl-field"><label>From date</label><input type="date" value={exportFrom} onChange={e => setExportFrom(e.target.value)} /></div>
                <div className="dl-field"><label>To date</label><input type="date" value={exportTo} onChange={e => setExportTo(e.target.value)} /></div>
              </div>
              <button className="dl-btn-primary" style={{ marginTop: 6 }} onClick={handleExportCsv}>Export CSV</button>
              <div className="dl-save-note">{exportNote}</div>
            </div>
          </section>
        )}

        {activeTab === 'settings' && (
          <section>
            <div className="dl-card">
              <h2>Pay &amp; schedule</h2>
              <div className="dl-field-row">
                <div className="dl-field"><label>Monthly salary (RM)</label><input type="number" step="0.01" min="0" placeholder="e.g. 2600" value={settingsDraft.monthlySalary || ''} onChange={e => setSettingsDraft(d => ({ ...d, monthlySalary: e.target.value }))} /></div>
                <div className="dl-field"><label>Driver start date</label><input type="date" value={settingsDraft.startDate} onChange={e => setSettingsDraft(d => ({ ...d, startDate: e.target.value }))} /></div>
              </div>
              <div className="dl-field-row">
                <div className="dl-field"><label>Normal start time</label><input type="time" value={settingsDraft.standardStart} onChange={e => setSettingsDraft(d => ({ ...d, standardStart: e.target.value }))} /></div>
                <div className="dl-field"><label>Normal end time</label><input type="time" value={settingsDraft.standardEnd} onChange={e => setSettingsDraft(d => ({ ...d, standardEnd: e.target.value }))} /></div>
              </div>
              <div className="dl-field-row">
                <div className="dl-field"><label>Unpaid break (hours)</label><input type="number" step="0.5" min="0" value={settingsDraft.breakHours} onChange={e => setSettingsDraft(d => ({ ...d, breakHours: e.target.value }))} /></div>
                <div className="dl-field"><label>Paid hours/day (auto)</label><input type="text" disabled value={fmtHrs(paidHoursPerDay(settingsDraft)) + ' hrs'} /></div>
              </div>
              <button className="dl-btn-primary" style={{ marginTop: 6 }} onClick={handleSaveSettings}>Save settings</button>
              <div className="dl-save-note">{settingsSaveNote}</div>
              <div className="dl-hint">Hourly rate = monthly salary ÷ 26 days ÷ 8 hours. This rate is used for all OT calculations below. The driver's starting month ({settingsDraft.startDate ? settingsDraft.startDate.slice(0, 7) : '—'}) is automatically pro-rated by calendar days from the start date; every month after pays the full monthly salary.</div>
              <div className="dl-hint" style={{ marginTop: 10 }}>Sign-in passwords are managed in Firebase Console → Authentication → Users, not here — see FIREBASE_AUTH_SETUP.md.</div>
            </div>

            <div className="dl-card">
              <h2>Public holidays</h2>
              <div className="dl-field-row">
                <div className="dl-field"><label>Date</label><input type="date" value={phDate} onChange={e => setPhDate(e.target.value)} /></div>
                <div className="dl-field"><label>Name</label><input type="text" placeholder="e.g. Merdeka Day" value={phName} onChange={e => setPhName(e.target.value)} /></div>
              </div>
              <button className="dl-btn-primary" style={{ marginTop: 4 }} onClick={handleAddHoliday}>Add holiday</button>
              <div style={{ marginTop: 10 }}>
                {settings.publicHolidays.length === 0 && <div className="dl-empty-note">No public holidays added yet.</div>}
                {settings.publicHolidays.map(ph => (
                  <div className="dl-ph-row" key={ph.date}>
                    <div><span className="d">{ph.date}</span> &nbsp; <span className="n">{ph.name}</span></div>
                    <button className="dl-log-del" onClick={() => handleDeleteHoliday(ph.date)} aria-label="Remove holiday">&times;</button>
                  </div>
                ))}
              </div>
              <div className="dl-hint">Rest days (Sat &amp; Sun) are detected automatically. Add public holidays here so OT is calculated at the right rate.</div>
            </div>

            <div className="dl-card">
              <h2>How OT is calculated</h2>
              <div className="dl-hint">
                Irham's normal working hours are fixed at <strong>{settingsDraft.standardStart}–{settingsDraft.standardEnd}</strong> ({fmtHrs(paidHoursPerDay(settingsDraft))} hours/day after the unpaid break).<br /><br />
                <strong>Workday</strong> — hours worked after {settingsDraft.standardEnd} are paid at 1.5× the hourly rate.<br /><br />
                <strong>Rest day</strong> — up to 4 hours worked pays 0.5 day's wage; more than 4 hours pays 1 day's wage. Any hours worked <em>in total</em> beyond the normal daily quota are paid separately at 2× the hourly rate — based on total hours worked, not what time of day they fall. A short shift entirely outside {settingsDraft.standardStart}–{settingsDraft.standardEnd} that doesn't exceed the daily quota gets no premium, per s.60(3) of the Employment Act.<br /><br />
                <strong>Public holiday</strong> — any work pays 2 days' wages flat, as long as total hours worked don't exceed the normal daily quota — again based on total hours, not clock time. Only hours worked <em>in total</em> beyond that quota are paid separately at 3× the hourly rate, per s.60D of the Employment Act.
              </div>
            </div>
          </section>
        )}

      </main>

      <footer className="dl-footer">
        <p>Shared logbook — check-ins and trips are visible only to authorized users.</p>
      </footer>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DriverLog />);
</script>
</body>
</html>
